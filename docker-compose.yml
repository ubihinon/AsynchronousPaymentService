version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: payment_service_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - api_network

  api:
    build: .
    container_name: payment_service_app
    working_dir: /app
    command: uvicorn core.main:app --host 0.0.0.0 --port 8000 --reload
#    command: bash -c "cd /app/.venv/bin/ && uvicorn core.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - VIRTUAL_ENV=/app/.venv
      - PATH=/app/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - ENV_FILE=.env
      - PYTHONPATH=${PYTHONPATH:-/app/src}
      - DATABASE_URL=${DATABASE_URL}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api_network

volumes:
  postgres_data:

networks:
  api_network:
    driver: bridge
